# Refreshes match data, rebuilds ratings, and deploys the site (with the photo
# service) to Vercel. GitHub Pages now only serves a redirect to the Vercel site,
# so old links keep working.
# Runs hourly; during an event, live pages also pull fresh results in the browser.
name: Update and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://ftcstats-photos.vercel.app
  # not secrets: they only say which Vercel project to deploy to
  VERCEL_ORG_ID: team_r1o66OZwsgZCXGjollpuMNFZ
  VERCEL_PROJECT_ID: prj_EYnS7Q15FgxkYGBeqF5AyCkwb0iF

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # finished events never change, so keep the raw API cache between runs.
      # One cache per day (saved only when the day's key is new) keeps storage small.
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: ftc-cache-v2-${{ steps.day.outputs.day }}
          restore-keys: ftc-cache-v2-
      - run: npm run update
        env:
          # FIRST API: event streams and official alliances; YouTube: stream timings (each skipped if unset)
          FTC_API_USER: ${{ secrets.FTC_API_USER }}
          FTC_API_KEY: ${{ secrets.FTC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: npm run check
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/package-vercel.mjs
          npx -y vercel@63.1.2 deploy dist --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
      # GitHub Pages: a tiny page that forwards to the same page on Vercel
      - name: Build redirect page
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>FTCstats has moved</title>
          <meta name="robots" content="noindex">
          <script>location.replace("${SITE_URL}/" + location.hash)</script>
          <p>FTCstats has moved to <a href="${SITE_URL}/">${SITE_URL}</a>.</p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
