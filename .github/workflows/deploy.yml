# Refreshes match data from FTCScout, rebuilds ratings, and deploys to GitHub Pages.
# Runs hourly; during an event, live pages also pull fresh results in the browser.
name: Update and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # finished events never change, so keep the raw API cache between runs.
      # One cache per day (saved only when the day's key is new) keeps storage small.
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: ftc-cache-v2-${{ steps.day.outputs.day }}
          restore-keys: ftc-cache-v2-
      - run: npm run update
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
