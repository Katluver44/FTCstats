<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>oddrobot</title>
  <meta name="description" content="FTC team ratings, match predictions and live ranking forecasts.">
  <meta name="theme-color" content="#1c1c1c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="oddrobot">
  <meta property="og:description" content="FTC team ratings, match predictions you can check, and live ranking forecasts.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/model.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/seasons.js">
  <link rel="modulepreload" href="js/live.js">
  <link rel="modulepreload" href="js/playoffs.js">
  <link rel="modulepreload" href="js/charts.js">
  <link rel="modulepreload" href="js/sos.js">
  <link rel="modulepreload" href="js/analytics.js">
  <link rel="modulepreload" href="js/advancement.js">
  <!-- the season index is the first thing the app asks for: start it alongside the scripts -->
  <link rel="preload" href="data/index.json" as="fetch" crossorigin="anonymous">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="#/" aria-label="oddrobot home">
        <svg class="bot logo-bot" width="34" height="34" viewBox="-28 -28 56 56" aria-hidden="true"><g class="bot-g">
          <rect x="-20" y="-20" width="40" height="40" rx="6" class="wf-body"/>
          <rect x="-17" y="-25" width="12" height="6" rx="2" class="wf-wheel"/><rect x="5" y="-25" width="12" height="6" rx="2" class="wf-wheel"/>
          <rect x="-17" y="19" width="12" height="6" rx="2" class="wf-wheel"/><rect x="5" y="19" width="12" height="6" rx="2" class="wf-wheel"/>
        </g></svg>
        <span class="logo-text">odd<i>robot</i></span>
      </a>
      <nav class="nav-links">
        <a data-page="teams">Teams</a>
        <a data-page="events">Events</a>
        <a data-page="compete">Compete</a>
      </nav>
      <div class="search nav-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input placeholder="Search teams &amp; events" autocomplete="off" aria-label="Search teams and events">
        <div class="search-results"></div>
      </div>
      <button type="button" class="icon-btn nav-search-btn" aria-label="Search teams and events" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <div class="season-picker" id="season">
        <button type="button" class="season-btn" aria-expanded="false" aria-controls="season-menu">
          <span class="season-cur"></span>
          <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="season-menu" id="season-menu" hidden></div>
      </div>
    </div>
  </header>
  <main id="app"><div class="loading">Loading…</div></main>
  <footer>Match data from the <a href="https://ftc-events.firstinspires.org/api" target="_blank" rel="noopener">FIRST FTC Events API</a>, via <a href="https://ftcscout.org" target="_blank" rel="noopener">FTCScout</a> · not affiliated with FIRST</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
